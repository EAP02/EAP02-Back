spring:
  application:
    name: devnet
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devnet}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

devnet:
  api:
    version: v1
    url-servidor: ${API_URL:http://localhost:8080}
  seguridad:
    origenes-permitidos: ${CORS_ORIGENES:http://localhost:3000,http://localhost:5173}
    vigencia-acceso: 15m
    vigencia-refresco: 7d
    intentos-maximos: 5
    bloqueo: 15m
  reputacion:
    minima-para-discusion: 10
    minima-para-mensaje-a-desconocido: 25
  almacenamiento:
    tamano-maximo-bytes: 5242880
    tipos-permitidos: image/jpeg,image/png,image/webp
    vigencia-url-firmada: 1h

logging:
  level:
    root: INFO
    com.codefactory.devnet: INFO
