spring:
  application:
    name: devnet
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devnet}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # El plan gratuito de Supabase limita las conexiones simultaneas y el pooler
      # opera en modo transaccion.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      # ADR-003: Hibernate NUNCA crea ni modifica el esquema. Solo verifica que las
      # entidades correspondan a lo que Flyway construyo. Si no coinciden, la
      # aplicacion no arranca, que es exactamente lo que queremos.
      #
      # Estuvo en 'update' tras la integracion de modulos, lo que dejaba el esquema
      # en manos de Hibernate y vaciaba de sentido el modelo de datos. Revertido.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # En false a proposito: si la base tiene objetos sin historial de migracion,
    # queremos enterarnos, no que Flyway asuma una linea base y siga.
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

devnet:
  api:
    version: v1
    url-servidor: ${API_URL:http://localhost:8080}
  seguridad:
    origenes-permitidos: ${CORS_ORIGENES:http://localhost:3000,http://localhost:5173}
    vigencia-acceso: 15m
    vigencia-refresco: 7d
    # El navegador descarta una cookie Secure sobre http://localhost. En false SOLO
    # aqui: application-prod.yml no la define y el valor por defecto del codigo es true,
    # asi que un despliegue nunca hereda este valor por descuido.
    cookie-segura: false
    intentos-maximos: 5
    bloqueo: 15m
  reputacion:
    minima-para-discusion: 10
    minima-para-mensaje-a-desconocido: 25
  almacenamiento:
    tamano-maximo-bytes: 5242880
    tipos-permitidos: image/jpeg,image/png,image/webp
    vigencia-url-firmada: 1h

logging:
  level:
    root: INFO
    com.codefactory.devnet: INFO
