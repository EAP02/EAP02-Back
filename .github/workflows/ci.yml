# =============================================================================
#  DevNet - pipeline de integracion continua
#
#  Lineamiento 7.2. La integracion se BLOQUEA si falla la compilacion, las
#  pruebas obligatorias, la cobertura minima, el Quality Gate o los controles
#  criticos de seguridad. Tras integrar, el pipeline vuelve a ejecutarse sobre
#  la rama principal.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la ejecucion anterior: no tiene
# sentido gastar minutos validando un commit ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: backend

jobs:

  # ---------------------------------------------------------------------------
  # Etapa: validacion, pruebas y calidad
  # ---------------------------------------------------------------------------
  construir:
    name: Construir, probar y medir
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historial completo para atribuir la deuda
          # tecnica al commit que la introdujo.
          fetch-depth: 0

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar
        run: mvn -B clean compile

      # Testcontainers usa el demonio Docker del runner, disponible por defecto
      # en ubuntu-latest. Aqui corren unitarias e integracion.
      - name: Pruebas y cobertura
        run: mvn -B verify

      - name: Publicar resultados de pruebas
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: backend/target/surefire-reports/TEST-*.xml
          check_name: Resultados de pruebas

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: backend/target/site/jacoco/

      # El contrato OpenAPI se publica como artefacto versionado de cada
      # construccion (ADR-002).
      - name: Guardar contrato OpenAPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/target/classes/static/openapi*.json
          if-no-files-found: ignore

      - name: SonarCloud
        # Se omite en pull requests de forks: no tienen acceso al secreto.
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ vars.SONAR_ORG }} \
            -Dsonar.projectKey=devnet

  # ---------------------------------------------------------------------------
  # Etapa: seguridad  (lineamiento 7.2: SAST, SCA y deteccion de secretos)
  # ---------------------------------------------------------------------------
  seguridad:
    name: Analisis de seguridad
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SCA: dependencias con vulnerabilidades conocidas.
      - name: Analisis de composicion
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend
          # Cero vulnerabilidades criticas abiertas para liberar
          # (lineamiento 6.3). ALTAS tambien bloquean: con este volumen de
          # dependencias, tolerarlas seria acumular deuda invisible.
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      # Deteccion de secretos: una clave commiteada por error ya esta
      # comprometida aunque se borre despues, porque queda en el historial.
      - name: Buscar secretos en el historial
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Etapa: imagen. Solo tras integrar en main.
  # ---------------------------------------------------------------------------
  imagen:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    needs: [construir, seguridad]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Autenticarse en el registro
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          # Etiquetada por SHA ademas de latest: una imagen inmutable y
          # rastreable hasta el commit exacto que la produjo.
          tags: |
            ghcr.io/${{ github.repository }}/devnet-api:latest
            ghcr.io/${{ github.repository }}/devnet-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Desplegar en Render
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
        working-directory: .