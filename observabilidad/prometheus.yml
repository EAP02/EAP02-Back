# Prometheus de DevNet (ADR-010). Lee las metricas de Micrometer que la API publica en
# /actuator/prometheus y evalua las alertas de alertas.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: devnet-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
    # El endpoint exige el token del scraper (FiltroMetricas), no un JWT de usuario.
    # Este valor es el de desarrollo, desechable. Contra Render o un entorno real, el
    # token va en un archivo y se referencia con 'credentials_file', nunca inline.
    authorization:
      type: Bearer
      credentials: metricas-local-desechable
