# ===========================================================================
# Perfil LOCAL - desarrollo en la maquina del equipo.
#
# Apunta al PostgreSQL de docker-compose. Nunca a Supabase: el lineamiento 7.3
# prohibe reutilizar datos y credenciales entre entornos.
#
#   docker compose up -d
#   ./mvnw spring-boot:run
# ===========================================================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/devnet
    username: devnet
    password: devnet          # credencial local sin valor: la base es desechable

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.codefactory.devnet: DEBUG
    # Consultas y parametros: solo en local, nunca en un entorno con datos reales.
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG
  pattern:
    # Consola legible en local. El JSON de logback-spring.xml se activa en los
    # demas perfiles, donde lo consume una herramienta y no una persona.
    console: "%d{HH:mm:ss.SSS} %highlight(%-5level) [%X{traceId:-}] %cyan(%logger{28}) - %msg%n"

devnet:
  seguridad:
    origenes-permitidos: http://localhost:3000,http://localhost:5173